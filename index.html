<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Study Program</title>
<meta name="theme-color" content="#0B6B61">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css?v=20260926-p1">
<script src="app.js?v=20260926-p1" defer onerror="var b=document.getElementById('boot');if(b)b.textContent='โหลดตัวโปรแกรมไม่สำเร็จ — ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชหน้านี้'"></script>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark">ВКА · СУЛА</div>
      <div class="brand-name">Study Program</div>
      <div class="brand-sub">คลังความรู้รวมทุกวิชาในหลักสูตร</div>
    </div>
    <nav id="nav" aria-label="รายวิชา"></nav>
  </aside>

  <main class="stage">
    <div class="topbar">
      <div class="searchbox">
        <input type="search" id="search" placeholder="ค้นหาทุกวิชา: устойчивость, มุมปะทะ, Kalman …" autocomplete="off" spellcheck="false">
        <span class="kbd">/</span>
      </div>
      <button id="quizBtn">ควิซ</button>
      <div class="progress-chip">
        <span class="track"><span id="allBar" style="width:0%"></span></span>
        <span id="allTxt">0%</span>
      </div>
    </div>
    <div id="view"><p class="boot" id="boot" role="status">กำลังโหลด…</p></div>
    <noscript><p class="boot">เว็บนี้ต้องเปิด JavaScript ในเบราว์เซอร์จึงจะแสดงเนื้อหาได้</p></noscript>
  </main>
</div>

<button id="topBtn" aria-label="กลับขึ้นบนสุด">↑</button>
<nav id="bbar" aria-label="เมนูหลัก">
  <button data-bb="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>ภาพรวม</button>
  <button data-bb="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>ค้นหา</button>
  <button data-bb="glossary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11.5a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15h11"/></svg>ศัพท์</button>
  <button data-bb="flash"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="13.5" height="13" rx="2"/><path d="M8 4h10.5a2 2 0 0 1 2 2v11"/></svg>การ์ด</button>
  <button data-bb="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.3 2.3 0 1 1 3.2 2.1c-.75.33-.9.9-.9 1.7"/><path d="M12 16.4v.2"/></svg>ควิซ</button>
</nav>

</body>
</html>
